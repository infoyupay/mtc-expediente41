name: Manual selective build

on:
  workflow_dispatch:
    inputs:
      tests:
        description: "Test classes or patterns, separated by commas"
        required: false
        default: "com.infoyupay.mtcexpediente41.BuildProbeTest"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Assemble and run selected tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "26"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Assemble application
        run: ./gradlew --no-daemon clean assemble

      - name: Run selected tests
        shell: bash
        env:
          SELECTED_TESTS: ${{ inputs.tests }}
        run: |
          test_args=(test)

          IFS=',' read -ra test_patterns <<< "$SELECTED_TESTS"

          for test_pattern in "${test_patterns[@]}"; do
            test_pattern="${test_pattern//[[:space:]]/}"

            if [[ -n "$test_pattern" ]]; then
              test_args+=(--tests "$test_pattern")
            fi
          done

          ./gradlew --no-daemon "${test_args[@]}"
